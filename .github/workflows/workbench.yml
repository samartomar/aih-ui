name: Workbench families
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordinary-families:
    # Playwright 1.56.1 has no Chromium for ubuntu-latest (Ubuntu 26.04); keep a supported image.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.12.1
      # Independent producer checkpoints; consume their packed public interfaces.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: samartomar/aih-core
          ref: 0617b5ddfddf9461ce625606747d2336bd0a9ac8
          path: .ci/core
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: samartomar/aih-catalog
          ref: e8fe3662f0a869184b307ffda46daefea677fee2
          path: .ci/catalog
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: samartomar/aih-scan
          ref: 59c88a2f905381f4a9f56c809556fd611c08838f
          path: .ci/scan
          persist-credentials: false
      - name: Build reviewed package checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workbench-packages"
          for component in core catalog scan; do
            (
              cd ".ci/$component"
              npm ci --ignore-scripts --no-audit --no-fund
              if [ "$component" = core ]; then
                npm run pack:distribution -- --pack-destination "$RUNNER_TEMP/workbench-packages"
              else
                npm run build
                npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/workbench-packages"
              fi
            )
          done
      - name: Install focused browser test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Check normal Workbench entry, installed families, policy save and fresh folder rebinding
        shell: bash
        run: |
          set -euo pipefail
          export CORE_TGZ="$RUNNER_TEMP/workbench-packages/aihq-core-1.0.0-dev.57.tgz"
          export CATALOG_TGZ="$RUNNER_TEMP/workbench-packages/aihq-catalog-0.1.0.tgz"
          export SCAN_TGZ="$RUNNER_TEMP/workbench-packages/aihq-scan-0.5.0.tgz"
          npm run check:workbench -- "$RUNNER_TEMP/workbench-consumer"
      - name: Build local presentation styles
        run: |
          npm run build:css
