<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>AIHQ Workbench</title>
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/approved.css">
<script type="module" src="/approved/start.js"></script>
</head>
<body>
<div id="intake-view">
<header class="ix-global"><div class="ix-width ix-global-inner">
      <a class="ix-brand" href="/"><span class="ix-logo" aria-hidden="true"><i></i><i></i><i></i></span><b>AIHQ</b> <span class="ix-brand-divider"></span><span>Workbench</span></a>
      <div class="ix-top-tools"><span class="ix-local"><i aria-hidden="true"></i>Local workspace</span><a id="ix-reports" class="ix-top-action" href="#intake/admin/reports">Reports</a><a id="ix-diagnostics" class="ix-top-action" href="#intake/admin/diagnostics">Diagnostics</a><a class="ix-light" id="ix-light" href="#light">Light edition</a></div>
    </div></header>
    <div class="ix-roles"><div class="ix-width ix-role-bar"><nav class="ix-role-nav" id="ix-role-nav" aria-label="Choose your role"></nav><a class="ix-profiles" id="ix-profiles" href="#intake/admin/profiles" title="Profiles"><span>Profiles</span></a></div></div>
    <div class="ix-hero"><canvas id="ix-ambient" aria-hidden="true"></canvas><div class="ix-width ix-hero-inner">
      <div class="ix-hero-copy"><h1 id="ix-title">Organization policy</h1><p id="ix-description"></p><a id="ix-shortcut" class="ix-quick" hidden></a></div>
      <div class="ix-diagram"><canvas id="ix-canvas" aria-hidden="true"></canvas><canvas id="ix-book" aria-hidden="true" hidden></canvas><button type="button" id="ix-motion" aria-label="Pause background motion"></button></div>
    </div></div>
    <main class="ix-width ix-layout">
      <aside class="ix-steps"><div class="ix-ledger-head"><h2 id="ix-rail-title"></h2><span id="ix-position"></span></div><nav id="ix-step-nav" aria-label="Setup steps"></nav><label class="ix-mobile-steps">Jump to step<select id="ix-step-select"></select></label></aside>
      <section class="ix-work" aria-labelledby="ix-step-title"><div class="ix-work-head"><a class="ix-back" id="ix-return-setup" hidden></a><p class="ix-kicker" id="ix-phase"></p><h2 id="ix-step-title" tabindex="-1"></h2><p id="ix-step-description" class="ix-step-description"></p></div><div id="ix-pane"></div><div id="ix-footer" class="ix-footer"></div></section>
    </main><p id="ix-status" class="ix-toast" role="status"></p>
</div>
</body>
</html>
